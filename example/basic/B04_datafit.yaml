# Step 4: Dataset + selection + normalization parameter + real data fit.
# Extends B03 by loading the same ROOT file as both model (MC) and observed data,
# enabling a true data-vs-MC fit instead of an Asimov fit.
# Run from the project root: gundamFitter -c example/basic/B04_datafit.yaml

outputFolder: "./example/basic/output"

fitterEngineConfig:

  minimizerConfig:
    type: "RootMinimizer"

  likelihoodInterfaceConfig:

    dataSetList:
      - name: "My dataset 1"
        isEnabled: true
        selectedDataEntry: "data"

        model:
         filePathList:
            - "./mockDatasetGen/mydataset.root"

         tree: "events"
         nominalTreeWeightFormula:
           - "asimovWeight"

        data:
          - name: "data"
            tree: "events"
            filePathList:
            - "./mockDatasetGen/mydataset.root"

    propagatorConfig:

      sampleSetConfig:
        sampleList:
          - name: "Selection 1"
            isEnabled: true
            selectionCutStr: "selection == 1"
            binning: "./example/basic/selection_1d.txt"
            dataSets: [ "My dataset 1" ]

      parametersManagerConfig:
        parameterSetList:
          - name: "Systematics"
            isEnabled: true

            nominalStepSize: 0.1

            parameterDefinitions:
             - name: “Free normalization”
               isEnabled: true
               priorType: Flat
               priorValue: 1.0
               parameterStepSize: 0.1
               dialSetDefinitions:
                - dialType: Normalization
                  applyOnDataSets: [ "My dataset 1" ]
