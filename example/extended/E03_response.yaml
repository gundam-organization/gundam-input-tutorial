# Step 6: Spline response function
# Builds on Step 5 by adding a parameter whose response function is read from the
# `par1_TGraph` branch in the input file. ROOT's TSpline interpolation is applied
# to this dial.
# Run from the project root: gundamFitter -c example/extended/E03_response.yaml

outputFolder: "./example/extended/output"

fitterEngineConfig:

  minimizerConfig:
    type: "RootMinimizer"

  likelihoodInterfaceConfig:

    dataSetList:
      - name: "My dataset 1"

        model:

          filePathList:
            - "./mockDatasetGen/mydataset.root"

          tree: "events"

          selectionCutFormula: "selection != -1"

          nominalTreeWeightFormula:
            - "asimovWeight"

    propagatorConfig:

      sampleSetConfig:
        sampleList:
          - name: "Selection 1 (1D: pmu)"
            isEnabled: true
            selectionCutStr: "selection == 1"
            binning: "./example/extended/selection_1d.txt"
            dataSets: [ "My dataset 1" ]

          - name: "Selection 2 (2D: pmu x pp)"
            isEnabled: true
            selectionCutStr: "selection == 2"
            binning: "./example/extended/selection_2d.txt"
            dataSets: [ "My dataset 1" ]

          - name: "Selection 3 (3D: enu x pmu x pp)"
            isEnabled: true
            selectionCutStr: "selection == 3"
            binning: "./example/extended/selection_3d.txt"
            dataSets: [ "My dataset 1" ]

      parametersManagerConfig:
        parameterSetList:
          - name: "Free normalization parameters"
            isEnabled: true
            nominalStepSize: 0.1
            useOnlyOneParameterPerEvent: true
            dialSetDefinitions:
              - applyOnDataSets: [ "My dataset 1" ]
                parametersBinningPath: "./example/extended/parameters.txt"

          - name: "Spline response"
            isEnabled: true
            nominalStepSize: 0.1
            parameterDefinitions:
              - name: "par1_spline"
                isEnabled: true
                priorValue: 1.0
                isFixed: false
                isThrown: false
                parameterStepSize: 0.1
                parameterLimits: [-3.0, 3.0]
                dialSetDefinitions:
                  - dialType: Spline
                    options: "not-a-knot"
                    treeExpression: par1_TGraph
                    applyOnDataSets: [ "My dataset 1" ]
                    allowDialExtrapolation: false
                    minDialResponse: 0.0
                    maxDialResponse: 3.0

